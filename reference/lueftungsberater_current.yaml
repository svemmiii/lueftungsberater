            {{ states('sensor.zuhause_co2_sensor_co2') | float(0) }}

  # -------------------------------------------------------------------------
  # Nächstes gutes Lüftungsfenster
  #
  # Forecast bleibt stündlich. Wir interpolieren Temperatur und absolute
  # Feuchte im Nahbereich auf 10-Minuten-Schritte. Die Anzeige ist deshalb
  # bewusst "ca." und keine Messwert-Garantie.
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Nächstes gutes Lüftungsfenster"
        unique_id: naechstes_gutes_lueftungsfenster
        default_entity_id: sensor.naechstes_gutes_lueftungsfenster
        device_class: timestamp
        icon: mdi:clock-outline

        availability: >
          {{
            state_attr(
              'sensor.lueftungs_wetterprognose',
              'forecast_24h'
            )
            | default([], true)
            | count >= 2
          }}

        state: >
          {% set fc =
            state_attr(
              'sensor.lueftungs_wetterprognose',
              'forecast_24h'
            )
            | default([], true)
          %}

          {% set ti =
            states('sensor.durchschnitt_temperatur') | float(21)
          %}
          {% set hi =
            states('sensor.luftfeuchtigkeit_durchschnitt') | float(50)
          %}
          {% set ahi =
            states('sensor.absolute_luftfeuchtigkeit_innen') | float(10)
          %}
          {% set co2 =
            states('sensor.zuhause_co2_sensor_co2') | float(0)
          %}
          {% set soll =
            state_attr('climate.master_temperatur', 'temperature')
            | float(21)
          %}
          {% set hours =
            states('sensor.stunden_seit_letzter_lueftung') | float(0)
          %}

          {% set need_co2 = co2 >= 1000 %}
          {% set need_moisture = hi >= 60 %}
          {% set need_cooling = ti >= soll + 1 %}
          {% set need_warming = ti <= soll - 1 %}
          {% set need_routine =
            hours >= 24
            and co2 < 1000
          %}

          {% set need_any =
            need_co2
            or need_moisture
            or need_cooling
            or need_warming
            or need_routine
          %}

          {% set unit =
            state_attr(
              'weather.bornheim',
              'wind_speed_unit'
            )
            | default('km/h', true)
          %}

          {% set ns =
            namespace(
              first_any=none,
              first_good=none,
              first_optimal=none
            )
          %}

          {% if need_any %}

            {% for f in fc[:24] %}

              {% set fdt =
                as_datetime(
                  f.get('datetime'),
                  none
                )
              %}

              {% if
                fdt is not none
                and
                as_timestamp(fdt)
                >
                as_timestamp(now())
                and
                as_timestamp(fdt)
                <=
                as_timestamp(
                  now() + timedelta(hours=24)
                )
              %}

                {% set t = f.get('temperature') %}
                {% set ah = f.get('humidity_absolute') %}
                {% set rh = f.get('humidity') %}

                {% if
                  ah is none
                  and t is not none
                  and rh is not none
                %}
                  {% set tt0 = t | float %}
                  {% set rr = rh | float %}

                  {% set ah =
                    216.7
                    *
                    (
                      (rr / 100)
                      * 6.112
                      * e ** (
                        (17.62 * tt0)
                        /
                        (243.12 + tt0)
                      )
                    )
                    /
                    (273.15 + tt0)
                  %}
                {% endif %}

                {% if
                  t is not none
                  and ah is not none
                %}

                  {% set tt = t | float %}
                  {% set aa = ah | float %}
                  {% set diff = ahi - aa %}

                  {% set cond =
                    f.get('condition', '')
                  %}
                  {% set pop =
                    f.get(
                      'precipitation_probability',
                      0
                    )
                    | float(0)
                  %}
                  {% set rain =
                    f.get(
                      'precipitation',
                      0
                    )
                    | float(0)
                  %}
                  {% set wind =
                    f.get(
                      'wind_speed',
                      0
                    )
                    | float(0)
                  %}
                  {% set gust =
                    f.get(
                      'wind_gust_speed',
                      0
                    )
                    | float(0)
                  %}

                  {% if unit in ['m/s','mps'] %}
                    {% set wind = wind * 3.6 %}
                    {% set gust = gust * 3.6 %}
                  {% elif unit == 'mph' %}
                    {% set wind = wind * 1.60934 %}
                    {% set gust = gust * 1.60934 %}
                  {% endif %}

                  {# Harte Wettergrenzen: kein Kandidat. #}
                  {% set unsafe =
                    cond in [
                      'lightning',
                      'lightning-rainy',
                      'hail',
                      'exceptional',
                      'pouring'
                    ]
                    or rain >= 2.5
                    or wind >= 50
                    or gust >= 65
                  %}

                  {# Ist Lüften für mindestens einen
                     vorhandenen Bedarf überhaupt sinnvoll? #}
                  {% set useful =
                    (
                      need_co2
                      and tt <= ti + 6
                      and diff >= -2.0
                    )
                    or
                    (
                      need_moisture
                      and diff >= 0.5
                      and tt <= ti + 5
                    )
                    or
                    (
                      need_cooling
                      and tt <= ti - 0.7
                      and diff >= -1.0
                    )
                    or
                    (
                      need_warming
                      and tt >= ti + 0.7
                      and tt <= soll + 4
                      and diff >= -1.0
                    )
                    or
                    (
                      need_routine
                      and tt <= ti + 3
                      and diff >= -1.0
                    )
                  %}

                  {% if not unsafe and useful %}

                    {% set score = 0 %}

                    {# Feuchtequalität #}
                    {% if diff >= 2 %}
                      {% set score = score + 3 %}
                    {% elif diff >= 0.5 %}
                      {% set score = score + 2 %}
                    {% elif diff >= -0.5 %}
                      {% set score = score + 1 %}
                    {% elif diff < -1.5 %}
                      {% set score = score - 3 %}
                    {% endif %}

                    {# Temperatur relativ zum eigentlichen Ziel #}
                    {% if need_cooling %}

                      {% if tt <= soll + 0.5 %}
                        {% set score = score + 3 %}
                      {% elif tt <= ti - 2 %}
                        {% set score = score + 2 %}
                      {% elif tt <= ti - 0.7 %}
                        {% set score = score + 1 %}
                      {% else %}
                        {% set score = score - 2 %}
                      {% endif %}

                    {% elif need_warming %}

                      {% if
                        tt >= soll - 0.5
                        and tt <= soll + 2
                      %}
                        {% set score = score + 3 %}
                      {% elif tt >= ti + 2 %}
                        {% set score = score + 2 %}
                      {% elif tt >= ti + 0.7 %}
                        {% set score = score + 1 %}
                      {% else %}
                        {% set score = score - 2 %}
                      {% endif %}

                    {% else %}

                      {% if
                        (tt - soll) | abs <= 2
                      %}
                        {% set score = score + 2 %}
                      {% elif
                        (tt - soll) | abs <= 4
                      %}
                        {% set score = score + 1 %}
                      {% endif %}

                    {% endif %}

                    {# Regen / Niederschlagswahrscheinlichkeit #}
                    {% if
                      rain == 0
                      and pop < 30
                    %}
                      {% set score = score + 2 %}
                    {% elif
                      rain < 0.3
                      and pop < 50
                    %}
                      {% set score = score + 1 %}
                    {% elif
                      rain >= 1
                      or pop >= 70
                    %}
                      {% set score = score - 2 %}
                    {% endif %}

                    {# Windqualität #}
                    {% if gust < 30 %}
                      {% set score = score + 1 %}
                    {% elif gust >= 45 %}
                      {% set score = score - 1 %}
                    {% endif %}

                    {# Grundqualität nach Score #}
                    {% if score >= 6 %}
                      {% set quality = 'optimal' %}
                    {% elif score >= 3 %}
                      {% set quality = 'gut' %}
                    {% elif score >= 0 %}
                      {% set quality = 'vertretbar' %}
                    {% else %}
                      {% set quality = 'ungeeignet' %}
                    {% endif %}

                    {# Regen darf einen ansonsten perfekten
                       Zeitpunkt herabstufen. #}
                    {% if
                      quality != 'ungeeignet'
                      and
                      (
                        rain >= 0.5
                        or pop >= 60
                        or wind >= 35
                        or gust >= 45
                      )
                    %}
                      {% set quality = 'vertretbar' %}

                    {% elif
                      quality == 'optimal'
                      and
                      (
                        rain > 0
                        or pop >= 35
                        or wind >= 25
                        or gust >= 35
                      )
                    %}
                      {% set quality = 'gut' %}
                    {% endif %}

                    {% if
                      quality != 'ungeeignet'
                      and ns.first_any is none
                    %}
                      {% set ns.first_any =
                        f.get('datetime')
                      %}
                    {% endif %}

                    {% if
                      quality in ['gut','optimal']
                      and ns.first_good is none
                    %}
                      {% set ns.first_good =
                        f.get('datetime')
                      %}
                    {% endif %}

                    {% if
                      quality == 'optimal'
                      and ns.first_optimal is none
                    %}
                      {% set ns.first_optimal =
                        f.get('datetime')
                      %}
                    {% endif %}

                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {# ------------------------------------------------------------
             Auswahl abhängig von der Dringlichkeit

             Viel CO2:
             lieber früher vertretbar als stundenlang auf Perfektion warten.

             Nur Routine:
             lieber auf ein wirklich gutes Fenster warten.
             ------------------------------------------------------------ #}

          {% if co2 >= 1400 %}
            {{
              ns.first_any
              if ns.first_any is not none
              else none
            }}

          {% elif co2 >= 1000 %}
            {{
              ns.first_good
              if ns.first_good is not none
              else ns.first_any
            }}

          {% elif hi >= 65 %}
            {{
              ns.first_good
              if ns.first_good is not none
              else ns.first_any
            }}

          {% elif need_cooling or need_warming %}
            {{
              ns.first_good
              if ns.first_good is not none
              else ns.first_any
            }}

          {% elif need_routine %}
            {{
              ns.first_optimal
              if ns.first_optimal is not none
              else
              (
                ns.first_good
                if ns.first_good is not none
                else ns.first_any
              )
            }}

          {% else %}
            {{
              ns.first_good
              if ns.first_good is not none
              else ns.first_any
            }}
          {% endif %}

        attributes:

          horizont_stunden: 24

          genauigkeit: >
            {% set n =
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            %}

            {% if n in [
              'unknown','unavailable','none',''
            ] %}
              kein_fenster
            {% else %}
              {% set dt = as_datetime(n, none) %}

              {% if
                dt is not none
                and
                as_timestamp(dt)
                <=
                as_timestamp(
                  now() + timedelta(hours=2)
                )
              %}
                nahbereich
              {% else %}
                grob
              {% endif %}
            {% endif %}

          qualitaet: >
            {% set chosen =
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            %}

            {% if chosen in [
              'unknown','unavailable','none',''
            ] %}
              kein_fenster

            {% else %}
              {% set fc =
                state_attr(
                  'sensor.lueftungs_wetterprognose',
                  'forecast_24h'
                )
                | default([], true)
              %}

              {% set ns =
                namespace(
                  rain=0,
                  pop=0,
                  wind=0,
                  gust=0,
                  found=false
                )
              %}

              {% for f in fc %}
                {% set dt =
                  as_datetime(
                    f.get('datetime'),
                    none
                  )
                %}

                {% if
                  dt is not none
                  and
                  as_timestamp(dt)
                  ==
                  as_timestamp(
                    as_datetime(chosen)
                  )
                %}
                  {% set ns.rain =
                    f.get('precipitation',0)
                    | float(0)
                  %}
                  {% set ns.pop =
                    f.get(
                      'precipitation_probability',
                      0
                    )
                    | float(0)
                  %}
                  {% set ns.wind =
                    f.get('wind_speed',0)
                    | float(0)
                  %}
                  {% set ns.gust =
                    f.get('wind_gust_speed',0)
                    | float(0)
                  %}
                  {% set ns.found = true %}
                {% endif %}
              {% endfor %}

              {% if
                ns.rain >= 0.5
                or ns.pop >= 60
                or ns.wind >= 35
                or ns.gust >= 45
              %}
                vertretbar
              {% elif
                ns.rain > 0
                or ns.pop >= 35
                or ns.wind >= 25
                or ns.gust >= 35
              %}
                gut
              {% else %}
                optimal
              {% endif %}
            {% endif %}

          regen_mm: >
            {% set chosen =
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            %}
            {% set fc =
              state_attr(
                'sensor.lueftungs_wetterprognose',
                'forecast_24h'
              )
              | default([], true)
            %}
            {% set ns = namespace(v=none) %}

            {% if chosen not in [
              'unknown','unavailable','none',''
            ] %}
              {% for f in fc %}
                {% set dt =
                  as_datetime(
                    f.get('datetime'),
                    none
                  )
                %}
                {% if
                  dt is not none
                  and
                  as_timestamp(dt)
                  ==
                  as_timestamp(as_datetime(chosen))
                %}
                  {% set ns.v =
                    f.get('precipitation')
                  %}
                {% endif %}
              {% endfor %}
            {% endif %}

            {{ ns.v }}

          regenwahrscheinlichkeit: >
            {% set chosen =
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            %}
            {% set fc =
              state_attr(
                'sensor.lueftungs_wetterprognose',
                'forecast_24h'
              )
              | default([], true)
            %}
            {% set ns = namespace(v=none) %}

            {% if chosen not in [
              'unknown','unavailable','none',''
            ] %}
              {% for f in fc %}
                {% set dt =
                  as_datetime(
                    f.get('datetime'),
                    none
                  )
                %}
                {% if
                  dt is not none
                  and
                  as_timestamp(dt)
                  ==
                  as_timestamp(as_datetime(chosen))
                %}
                  {% set ns.v =
                    f.get(
                      'precipitation_probability'
                    )
                  %}
                {% endif %}
              {% endfor %}
            {% endif %}

            {{ ns.v }}

  # -------------------------------------------------------------------------
  # Lesbarer Text zum nächsten Lüftungsfenster
  # -------------------------------------------------------------------------

      - name: "Nächstes Lüftungsfenster Text"
        unique_id: naechstes_lueftungsfenster_text
        default_entity_id: sensor.naechstes_lueftungsfenster_text
        icon: mdi:clock-check-outline

        state: >
          {% set n =
            states(
              'sensor.naechstes_gutes_lueftungsfenster'
            )
          %}

          {% set q =
            state_attr(
              'sensor.naechstes_gutes_lueftungsfenster',
              'qualitaet'
            )
            | default('unbekannt', true)
          %}

          {% if
            is_state(
              'binary_sensor.nina_aussenluftgefahr',
              'on'
            )
          %}
            Nach Ende der NINA-Außenluftwarnung neu bewerten

          {% elif
            is_state(
              'sensor.nina_lueftungsstatus',
              'vorsicht'
            )
          %}
            Nach Ende der NINA-Vorsicht neu bewerten

          {% elif n in [
            'unknown','unavailable','none',''
          ] %}
            Kein brauchbares Fenster in 24 h

          {% else %}
            {% set dt =
              as_local(
                as_datetime(n)
              )
            %}
            {% set mins =
              (
                as_timestamp(dt)
                - as_timestamp(now())
              ) / 60
            %}

            {% if mins <= 15 %}
              Gleich · {{ q }}

            {% elif mins <= 45 %}
              In etwa {{
                (mins / 10)
                | round(0)
                | int
                * 10
              }} Minuten · {{ q }}

            {% elif dt.date() == now().date() %}
              Heute gegen {{
                dt.strftime('%H:%M')
              }} Uhr · {{ q }}

            {% elif
              dt.date()
              ==
              (
                now()
                + timedelta(days=1)
              ).date()
            %}
              Morgen gegen {{
                dt.strftime('%H:%M')
              }} Uhr · {{ q }}

            {% else %}
              {{
                dt.strftime(
                  '%d.%m. gegen %H:%M'
                )
              }} Uhr · {{ q }}
            {% endif %}
          {% endif %}

        attributes:

          zeitpunkt: >
            {{
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            }}

          qualitaet: >
            {{
              state_attr(
                'sensor.naechstes_gutes_lueftungsfenster',
                'qualitaet'
              )
            }}

          regen_mm: >
            {{
              state_attr(
                'sensor.naechstes_gutes_lueftungsfenster',
                'regen_mm'
              )
            }}

          regenwahrscheinlichkeit: >
            {{
              state_attr(
                'sensor.naechstes_gutes_lueftungsfenster',
                'regenwahrscheinlichkeit'
              )
            }}

          minuten_bis_dahin: >
            {% set n =
              states(
                'sensor.naechstes_gutes_lueftungsfenster'
              )
            %}

            {% if n in [
              'unknown','unavailable','none',''
            ] %}
              {{ none }}
            {% else %}
              {{
                (
                  (
                    as_timestamp(
                      as_datetime(n)
                    )
                    -
                    as_timestamp(now())
                  )
                  / 60
                )
                | round(0)
                | int
              }}
            {% endif %}

          hinweis: >
            {% if
              is_state(
                'binary_sensor.nina_aussenluftgefahr',
                'on'
              )
              or
              is_state(
                'sensor.nina_lueftungsstatus',
                'vorsicht'
              )
            %}
              {{ none }}

            {% elif
              is_state(
                'sensor.lueftung_dwd_status',
                'gefahr'
              )
            %}
              Nur nutzen, wenn die aktuelle DWD-Warnung bis dahin aufgehoben wurde.

            {% elif
              state_attr(
                'sensor.naechstes_gutes_lueftungsfenster',
                'qualitaet'
              )
              == 'vertretbar'
            %}
              Bedingungen sind nicht ideal. Kurz bzw. unter Beobachtung lüften.

            {% else %}
              {{ none }}
            {% endif %}


      - name: "Lüftungsmodus"
        unique_id: lueftungsmodus
        default_entity_id: sensor.lueftungsmodus
        icon: mdi:brain

        availability: >
          {{
            states('sensor.absolute_luftfeuchtigkeit_innen') | is_number
            and
            states('sensor.absolute_luftfeuchtigkeit_aussen') | is_number
            and
            states('sensor.durchschnitt_temperatur') | is_number
            and
            states('sensor.draussen_temp_temperatur') | is_number
            and
            states('sensor.luftfeuchtigkeit_durchschnitt') | is_number
            and
            states('sensor.zuhause_co2_sensor_co2') | is_number
          }}

        state: >
          {% set ti =
            states('sensor.durchschnitt_temperatur') | float
          %}
          {% set ta =
            states('sensor.draussen_temp_temperatur') | float
          %}
          {% set hi =
            states('sensor.luftfeuchtigkeit_durchschnitt') | float
          %}
          {% set ahi =
            states('sensor.absolute_luftfeuchtigkeit_innen') | float
          %}
          {% set aha =
            states('sensor.absolute_luftfeuchtigkeit_aussen') | float
          %}
          {% set diff = ahi - aha %}
          {% set co2 =
            states('sensor.zuhause_co2_sensor_co2') | float
          %}
          {% set soll =
            state_attr('climate.master_temperatur', 'temperature')
            | float(21)
          %}
          {% set hours =
            states('sensor.stunden_seit_letzter_lueftung') | float(0)
          %}

          {% set nina =
            is_state('binary_sensor.nina_aussenluftgefahr', 'on')
          %}

          {% set nina_caution =
            is_state(
              'sensor.nina_lueftungsstatus',
              'vorsicht'
            )
          %}

          {% set weather_danger =
            is_state(
              'binary_sensor.lueftung_wetter_gefaehrlich',
              'on'
            )
          %}
          {% set rain_now =
            is_state(
              'binary_sensor.lueftung_radar_regen_aktuell',
              'on'
            )
          %}
          {% set rain_soon =
            is_state(
              'binary_sensor.lueftung_radar_regen_in_kuerze',
              'on'
            )
            or
            is_state(
              'binary_sensor.lueftung_regen_bald',
              'on'
            )
          %}

          {% set co2_critical = co2 > 2000 %}
          {% set co2_high = co2 >= 1400 %}
          {% set co2_elevated = co2 >= 1000 %}

          {% set moisture_urgent =
            hi >= 65 and diff >= 0.3
          %}
          {% set moisture_good =
            hi >= 60 and diff >= 1.0
          %}

          {% set too_hot =
            ti >= soll + 1
          %}
          {% set too_cold =
            ti <= soll - 1
          %}

          {% set cooling_good =
            too_hot
            and ta <= ti - 1
            and diff >= -0.5
          %}

          {% set warming_good =
            too_cold
            and ta >= ti + 1
            and ta <= soll + 4
            and diff >= -0.5
          %}

          {% set climate_ok =
            ta <= ti + 3
            and diff >= -1.0
          %}

          {% set routine =
            hours >= 24
            and co2 < 1000
            and climate_ok
          %}

          {# ------------------------------------------------------------ #}
          {# Intelligente Bewertung bei bereits geöffnetem Fenster       #}
          {# ------------------------------------------------------------ #}

          {% set open_now =
            is_state('binary_sensor.lueftung_geoeffnet', 'on')
          %}

          {# CO2-Hysterese:
             Start ab 1000 ppm, beim laufenden Lüften erst unter
             900 ppm sicher als erledigt betrachten. #}
          {% set continue_co2 =
            open_now and co2 >= 1000
          %}

          {% set continue_moisture =
            open_now
            and hi >= 60
            and diff >= 0.5
          %}

          {% set continue_cooling =
            open_now
            and ti > soll + 0.5
            and ta <= ti - 0.7
            and diff >= -0.5
          %}

          {% set continue_warming =
            open_now
            and ti < soll - 0.5
            and ta >= ti + 0.7
            and ta <= soll + 4
            and diff >= -0.5
          %}

          {% set continue_airing =
            continue_co2
            or continue_moisture
            or continue_cooling
            or continue_warming
          %}

          {% if nina %}
            nina_aussenluftgefahr

          {% elif weather_danger %}
            wettergefahr

          {% elif nina_caution %}
            nina_vorsicht

          {% elif
            open_now
            and continue_airing
            and not rain_now
          %}
            weiter_lueften

          {% elif
            open_now
            and not continue_airing
          %}
            lueftung_fertig

          {% elif co2_critical and (rain_now or rain_soon) %}
            co2_kritisch_vorsicht

          {% elif co2_critical %}
            co2_kritisch

          {% elif
            co2_high
            and climate_ok
            and not rain_now
          %}
            co2_lueften

          {% elif co2_high %}
            co2_warten

          {% elif
            co2_elevated
            and climate_ok
            and not rain_now
            and not rain_soon
          %}
            co2_lueften

          {% elif co2_elevated %}
            co2_warten

          {% elif
            moisture_urgent
            and not rain_now
            and not rain_soon
          %}
            feuchte_lueften

          {% elif
            moisture_good
            and not rain_now
            and not rain_soon
          %}
            feuchte_lueften

          {% elif cooling_good and not rain_now %}
            kuehlen

          {% elif warming_good and not rain_now %}
            erwaermen

          {% elif routine and not rain_now and not rain_soon %}
            routine_lueften

          {% elif hi >= 65 and diff < 0.3 %}
            feuchte_warten

          {% elif too_hot and ta >= ti + 1 %}
            aussen_zu_warm

          {% elif too_cold and ta <= ti - 1 %}
            aussen_zu_kalt

          {% elif diff <= -1.0 %}
            aussen_deutlich_feuchter

          {% elif hi < 40 and diff >= 0.5 %}
            innen_zu_trocken

          {% elif rain_now %}
            regen

          {% elif rain_soon %}
            regen_bald

          {% elif hours >= 24 %}
            routine_warten

          {% else %}
            normal
          {% endif %}

        attributes:

          co2_ppm: >
            {{ states('sensor.zuhause_co2_sensor_co2') }}

          solltemperatur: >
            {{
              state_attr(
                'climate.master_temperatur',
                'temperature'
              )
            }}

          nina_aussenluftgefahr: >
            {{
              is_state(
                'binary_sensor.nina_aussenluftgefahr',
                'on'
              )
            }}

  # -------------------------------------------------------------------------
  # Ampel
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Lüftungsampel"
        unique_id: lueftungsampel
        default_entity_id: sensor.lueftungsampel
        icon: mdi:traffic-light

        state: >
          {% set m = states('sensor.lueftungsmodus') %}

          {% if m in [
            'co2_kritisch',
            'co2_lueften',
            'weiter_lueften',
            'feuchte_lueften',
            'kuehlen',
            'erwaermen',
            'routine_lueften'
          ] %}
            gruen

          {% elif m in [
            'nina_aussenluftgefahr',
            'wettergefahr',
            'regen',
            'aussen_zu_warm',
            'aussen_zu_kalt',
            'aussen_deutlich_feuchter',
            'innen_zu_trocken'
          ] %}
            rot

          {% else %}
            gelb
          {% endif %}

  # -------------------------------------------------------------------------
  # Empfohlene Lüftungsdauer
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Empfohlene Lüftungsdauer"
        unique_id: empfohlene_lueftungsdauer
        default_entity_id: sensor.empfohlene_lueftungsdauer
        icon: mdi:timer-outline

        state: >
          {% set m = states('sensor.lueftungsmodus') %}
          {% set ta =
            states('sensor.draussen_temp_temperatur') | float(0)
          %}

          {% if m == 'weiter_lueften' %}
            Bis die offenen Lüftungsziele erreicht sind

          {% elif m == 'lueftung_fertig' %}
            Lüften kann beendet werden

          {% elif m == 'co2_kritisch_vorsicht' %}
            3–5 Minuten unter Beobachtung

          {% elif m == 'co2_kritisch' %}
            10–15 Minuten, danach CO₂ erneut prüfen

          {% elif m == 'co2_lueften' %}
            5–10 Minuten, bis CO₂ unter etwa 1000 ppm fällt

          {% elif m == 'kuehlen' %}
            15–30 Minuten bzw. solange draußen günstiger bleibt

          {% elif m == 'erwaermen' %}
            5–10 Minuten

          {% elif m in [
            'feuchte_lueften',
            'routine_lueften'
          ] %}
            {% if ta < -5 %}
              2–4 Minuten
            {% elif ta < 0 %}
              3–5 Minuten
            {% elif ta < 5 %}
              4–6 Minuten
            {% elif ta < 10 %}
              5–8 Minuten
            {% elif ta < 18 %}
              8–12 Minuten
            {% elif ta <= 25 %}
              10–15 Minuten
            {% else %}
              5–10 Minuten
            {% endif %}

          {% else %}
            Jetzt nicht nötig
          {% endif %}

  # -------------------------------------------------------------------------
  # Text fürs Dashboard
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Lüftungsempfehlung"
        unique_id: lueftungsempfehlung
        default_entity_id: sensor.lueftungsempfehlung
        icon: mdi:window-open-variant

        state: >
          {% set a = states('sensor.lueftungsampel') %}
          {% set offen =
            is_state('binary_sensor.lueftung_geoeffnet', 'on')
          %}

          {% if a == 'gruen' %}
            {{ 'Weiter lüften' if offen else 'Jetzt lüften' }}

          {% elif a == 'rot' %}
            {{ 'Jetzt schließen' if offen else 'Geschlossen lassen' }}

          {% else %}
            {% if
              states('sensor.lueftungsmodus')
              == 'nina_vorsicht'
            %}
              {{
                'Besser schließen'
                if offen
                else
                'Vorsicht – lieber geschlossen lassen'
              }}

            {% elif offen %}
              {% if
                states('sensor.lueftungsmodus')
                == 'co2_kritisch_vorsicht'
              %}
                Nur kurz unter Beobachtung
              {% else %}
                Lüften kann beendet werden
              {% endif %}

            {% else %}
              Noch nicht nötig / besser warten
            {% endif %}
          {% endif %}

        attributes:

          grund: >
            {% set m = states('sensor.lueftungsmodus') %}
            {% set ti =
              states('sensor.durchschnitt_temperatur') | float(0)
            %}
            {% set ta =
              states('sensor.draussen_temp_temperatur') | float(0)
            %}
            {% set hi =
              states('sensor.luftfeuchtigkeit_durchschnitt') | float(0)
            %}
            {% set ahi =
              states('sensor.absolute_luftfeuchtigkeit_innen') | float(0)
            %}
            {% set aha =
              states('sensor.absolute_luftfeuchtigkeit_aussen') | float(0)
            %}
            {% set diff = ahi - aha %}
            {% set co2 =
              states('sensor.zuhause_co2_sensor_co2') | float(0)
            %}
            {% set soll =
              state_attr('climate.master_temperatur', 'temperature')
              | float(21)
            %}

            {% if m == 'weiter_lueften' %}

              {% set ns = namespace(reasons=[]) %}

              {% if co2 >= 1000 %}
                {% set ns.reasons = ns.reasons + [
                  'CO₂ liegt noch bei ' ~ (co2 | round(0) | int) ~
                  ' ppm und sollte weiter sinken'
                ] %}
              {% endif %}

              {% if hi >= 60 and diff >= 0.5 %}
                {% set ns.reasons = ns.reasons + [
                  'die Raumluft hat noch ' ~ (hi | round(0) | int) ~
                  ' % Feuchtigkeit und draußen ist sie um ' ~
                  (diff | round(1)) ~ ' g/m³ trockener'
                ] %}
              {% endif %}

              {% if
                ti > soll + 0.5
                and ta <= ti - 0.7
                and diff >= -0.5
              %}
                {% set ns.reasons = ns.reasons + [
                  'innen sind noch ' ~ (ti | round(1)) ~
                  ' °C bei ' ~ (soll | round(1)) ~
                  ' °C Soll und draußen ist es mit ' ~
                  (ta | round(1)) ~ ' °C günstiger'
                ] %}
              {% endif %}

              {% if
                ti < soll - 0.5
                and ta >= ti + 0.7
                and ta <= soll + 4
                and diff >= -0.5
              %}
                {% set ns.reasons = ns.reasons + [
                  'innen sind nur ' ~ (ti | round(1)) ~
                  ' °C bei ' ~ (soll | round(1)) ~
                  ' °C Soll und draußen ist es mit ' ~
                  (ta | round(1)) ~ ' °C wärmer'
                ] %}
              {% endif %}

              Weiter lüften: {{ ns.reasons | join('; ') }}.

            {% elif m == 'lueftung_fertig' %}
              Der Luftaustausch ist ausreichend.
              CO₂ liegt bei {{ co2 | round(0) }} ppm,
              die Raumfeuchtigkeit bei {{ hi | round(0) }} %
              und die Raumtemperatur bei {{ ti | round(1) }} °C
              gegenüber {{ soll | round(1) }} °C Soll.
              Es besteht aktuell kein ausreichender Grund,
              das Fenster weiter offen zu lassen.

            {% elif m == 'nina_aussenluftgefahr' %}
              NINA meldet eine Gefahr für die Außenluft:
              {{ state_attr('binary_sensor.nina_aussenluftgefahr','warnung') }}.
              Fenster und Türen geschlossen halten. Diese Sicherheitswarnung hat Vorrang vor CO₂, Temperatur und Feuchtigkeit.

            {% elif m == 'nina_vorsicht' %}
              NINA meldet:
              {{
                state_attr(
                  'sensor.nina_lueftungsstatus',
                  'warnung'
                )
              }}.
              {{
                state_attr(
                  'sensor.nina_lueftungsstatus',
                  'beschreibung'
                )
              }}
              Handlungsempfehlung:
              {{
                state_attr(
                  'sensor.nina_lueftungsstatus',
                  'handlungsempfehlung'
                )
              }}
              Da ausdrücklich keine akute Gefahr bzw. Gesundheitsgefahr gemeldet wird, ist dies nur eine Vorsichtsstufe und keine harte Lüftungssperre.

            {% elif m == 'wettergefahr' %}

              {% set dwd_warnung =
                state_attr(
                  'sensor.lueftung_dwd_status',
                  'aktuelle_warnung'
                )
                | default('', true)
              %}

              {% set wetter =
                states('weather.bornheim')
              %}

              {% set wind =
                state_attr(
                  'weather.bornheim',
                  'wind_speed'
                )
                | float(0)
              %}

              {% set boeen =
                state_attr(
                  'weather.bornheim',
                  'wind_gust_speed'
                )
                | float(0)
              %}

              {% if dwd_warnung != '' %}

                DWD meldet aktuell:
                **{{ dwd_warnung }}**.
                Fenster und Türen geschlossen halten.

              {% elif wetter == 'lightning-rainy' %}

                Aktuell besteht eine Wettergefahr durch
                **Gewitter mit Regen**.
                Fenster und Türen geschlossen halten.

              {% elif wetter == 'lightning' %}

                Aktuell besteht eine Wettergefahr durch
                **Gewitter**.
                Fenster und Türen geschlossen halten.

              {% elif wetter == 'hail' %}

                Aktuell besteht eine Wettergefahr durch
                **Hagel**.
                Fenster und Türen geschlossen halten.

