  # LÜFTUNGSBERATER
  ###########################################################################

  # -------------------------------------------------------------------------
  # Aktuelle absolute Luftfeuchtigkeit innen / außen
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Absolute Luftfeuchtigkeit Innen"
        unique_id: absolute_luftfeuchtigkeit_innen
        default_entity_id: sensor.absolute_luftfeuchtigkeit_innen
        unit_of_measurement: "g/m³"
        icon: mdi:water-percent
        availability: >
          {{ states('sensor.durchschnitt_temperatur') | is_number
             and states('sensor.luftfeuchtigkeit_durchschnitt') | is_number }}
        state: >
          {% set t = states('sensor.durchschnitt_temperatur') | float %}
          {% set rh = states('sensor.luftfeuchtigkeit_durchschnitt') | float %}
          {{
            (
              216.7
              *
              (
                (rh / 100)
                * 6.112
                * (
                    2.718281828
                    **
                    ((17.62 * t) / (243.12 + t))
                  )
              )
              /
              (273.15 + t)
            )
            | round(2)
          }}


      - name: "Absolute Luftfeuchtigkeit Außen"
        unique_id: absolute_luftfeuchtigkeit_aussen
        default_entity_id: sensor.absolute_luftfeuchtigkeit_aussen
        unit_of_measurement: "g/m³"
        icon: mdi:water-percent
        availability: >
          {{ states('sensor.draussen_temp_temperatur') | is_number
             and states('sensor.draussen_temp_luftfeuchtigkeit') | is_number }}
        state: >
          {% set t = states('sensor.draussen_temp_temperatur') | float %}
          {% set rh = states('sensor.draussen_temp_luftfeuchtigkeit') | float %}
          {{
            (
              216.7
              *
              (
                (rh / 100)
                * 6.112
                * (
                    2.718281828
                    **
                    ((17.62 * t) / (243.12 + t))
                  )
              )
              /
              (273.15 + t)
            )
            | round(2)
          }}


      - name: "Stunden seit letzter Lüftung"
        unique_id: stunden_seit_letzter_lueftung
        default_entity_id: sensor.stunden_seit_letzter_lueftung
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >
          {% if is_state('binary_sensor.lueftung_geoeffnet', 'on') %}
            0
          {% else %}

            {% set last =
              states('sensor.letzte_bestaetigte_lueftung')
            %}

            {% if last not in [
              'unknown',
              'unavailable',
              'none',
              ''
            ] %}

              {{
                (
                  (
                    as_timestamp(now())
                    -
                    as_timestamp(last)
                  )
                  / 3600
                )
                | round(1)
              }}

            {% else %}
              {{ none }}
            {% endif %}

          {% endif %}


  # -------------------------------------------------------------------------
  # Fenster / Schiebetür
  # -------------------------------------------------------------------------

  - binary_sensor:

      - name: "Lüftung geöffnet"
        unique_id: lueftung_geoeffnet
        default_entity_id: binary_sensor.lueftung_geoeffnet
        icon: >
          {{
            'mdi:window-open'
            if
              is_state(
                'binary_sensor.wohnzimmer_wohnzimmer_schiebetur_tur',
                'on'
              )
              or
              is_state(
                'binary_sensor.kuche_fenster_kuche_tur',
                'on'
              )
            else
              'mdi:window-closed'
          }}
        state: >
          {{
            is_state(
              'binary_sensor.wohnzimmer_wohnzimmer_schiebetur_tur',
              'on'
            )
            or
            is_state(
              'binary_sensor.kuche_fenster_kuche_tur',
              'on'
            )
          }}


  # -------------------------------------------------------------------------
  # Eine echte Lüftung zählt ab 5 Minuten offen
  # -------------------------------------------------------------------------

  - triggers:

      - trigger: state
        entity_id: binary_sensor.lueftung_geoeffnet
        from: "on"
        to: "off"

    conditions:

      - condition: template
        value_template: >
          {{
            trigger.from_state is not none
            and
            (
              as_timestamp(trigger.to_state.last_changed)
              -
              as_timestamp(trigger.from_state.last_changed)
            ) >= 300
          }}

    sensor:

      - name: "Letzte bestätigte Lüftung"
        unique_id: letzte_bestaetigte_lueftung
        default_entity_id: sensor.letzte_bestaetigte_lueftung
        device_class: timestamp
        icon: mdi:window-open-variant
        state: "{{ now().isoformat() }}"

  # -------------------------------------------------------------------------
  # Wetterprognose
  #
  # Wir speichern absichtlich nur die nächsten 24 Stunden.
  # -------------------------------------------------------------------------

  - triggers:

      - trigger: homeassistant
        event: start

      - trigger: time_pattern
        minutes: "/30"

    actions:

      - action: weather.get_forecasts
        target:
          entity_id: weather.bornheim
        data:
          type: hourly
        response_variable: wetter_stuendlich

    sensor:

      - name: "Lüftungs Wetterprognose"
        unique_id: lueftungs_wetterprognose
        default_entity_id: sensor.lueftungs_wetterprognose
        icon: mdi:weather-partly-cloudy
        state: "{{ now().isoformat() }}"
        attributes:

          forecast_24h: >
            {{
              wetter_stuendlich
              .get('weather.bornheim', {})
              .get('forecast', [])[:24]
            }}


  # -------------------------------------------------------------------------
  # DWD-Warnungen
  #
  # Nicht jede DWD-Warnung ist fürs Lüften relevant.
  # Hitze/Frost usw. werden nicht pauschal als "Fenstergefahr" gewertet.
  #
  # Relevant:
  # - Gewitter
  # - Sturm / Orkan / Wind
  # - Hagel
  # - Starkregen / Dauerregen
  # -------------------------------------------------------------------------

  - sensor:

      - name: "Lüftung DWD Status"
        unique_id: lueftung_dwd_status
        default_entity_id: sensor.lueftung_dwd_status
        icon: mdi:weather-lightning

        state: >

          {% set cur =
            'sensor.stadt_bornheim_aktuelle_warnstufe'
          %}

          {% set adv =
            'sensor.stadt_bornheim_vorwarnstufe'
          %}

          {% set cur_level =
            states(cur) | int(0)
          %}

          {% set cur_count =
            state_attr(cur, 'warning_count') | int(0)
          %}

          {% set adv_count =
            state_attr(adv, 'warning_count') | int(0)
          %}

          {% set ns =
            namespace(
              cur_hit=false,
              adv_soon=false
            )
          %}


          {% for i in range(1, cur_count + 1) %}

            {% set text =
              (
                (
                  state_attr(
                    cur,
                    'warning_' ~ i ~ '_name'
                  )
                  | default('', true)
                )
                ~ ' '
                ~
                (
                  state_attr(
                    cur,
                    'warning_' ~ i ~ '_headline'
                  )
                  | default('', true)
                )
              )
              | lower
            %}

            {% if
              'gewitter' in text
              or 'sturm' in text
              or 'orkan' in text
              or 'wind' in text
              or 'hagel' in text
              or 'starkregen' in text
              or 'dauerregen' in text
            %}

              {% set ns.cur_hit = true %}

            {% endif %}

          {% endfor %}


          {% for i in range(1, adv_count + 1) %}

            {% set text =
              (
                (
                  state_attr(
                    adv,
                    'warning_' ~ i ~ '_name'
                  )
                  | default('', true)
                )
                ~ ' '
                ~
                (
                  state_attr(
                    adv,
                    'warning_' ~ i ~ '_headline'
                  )
                  | default('', true)
                )
              )
              | lower
            %}

            {% set start =
              state_attr(
                adv,
                'warning_' ~ i ~ '_start'
              )
            %}

            {% if
              (
                'gewitter' in text
                or 'sturm' in text
                or 'orkan' in text
                or 'wind' in text
                or 'hagel' in text
                or 'starkregen' in text
                or 'dauerregen' in text
              )
              and start is not none
              and
              as_timestamp(start)
              <=
              as_timestamp(
                now() + timedelta(hours=3)
              )
            %}

              {% set ns.adv_soon = true %}

            {% endif %}

          {% endfor %}


          {% if ns.cur_hit and cur_level >= 2 %}
            gefahr
          {% elif ns.cur_hit or ns.adv_soon %}
            achtung
          {% else %}
            keine
          {% endif %}


        attributes:

          aktuelle_warnung: >

            {% set e =
              'sensor.stadt_bornheim_aktuelle_warnstufe'
            %}

            {% set count =
              state_attr(e, 'warning_count') | int(0)
            %}

            {% set ns =
              namespace(text='')
            %}

            {% for i in range(1, count + 1) %}

              {% if ns.text == '' %}

                {% set t =
                  (
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_name'
                      )
                      | default('', true)
                    )
                    ~ ' '
                    ~
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_headline'
                      )
                      | default('', true)
                    )
                  )
                %}

                {% set low = t | lower %}

                {% if
                  'gewitter' in low
                  or 'sturm' in low
                  or 'orkan' in low
                  or 'wind' in low
                  or 'hagel' in low
                  or 'starkregen' in low
                  or 'dauerregen' in low
                %}

                  {% set ns.text =
                    state_attr(
                      e,
                      'warning_' ~ i ~ '_headline'
                    )
                    | default(
                        state_attr(
                          e,
                          'warning_' ~ i ~ '_name'
                        ),
                        true
                      )
                  %}

                {% endif %}

              {% endif %}

            {% endfor %}

            {{ ns.text }}


          vorwarnung: >

            {% set e =
              'sensor.stadt_bornheim_vorwarnstufe'
            %}

            {% set count =
              state_attr(e, 'warning_count') | int(0)
            %}

            {% set ns =
              namespace(text='')
            %}

            {% for i in range(1, count + 1) %}

              {% if ns.text == '' %}

                {% set t =
                  (
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_name'
                      )
                      | default('', true)
                    )
                    ~ ' '
                    ~
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_headline'
                      )
                      | default('', true)
                    )
                  )
                %}

                {% set low = t | lower %}

                {% if
                  'gewitter' in low
                  or 'sturm' in low
                  or 'orkan' in low
                  or 'wind' in low
                  or 'hagel' in low
                  or 'starkregen' in low
                  or 'dauerregen' in low
                %}

                  {% set ns.text =
                    state_attr(
                      e,
                      'warning_' ~ i ~ '_headline'
                    )
                    | default(
                        state_attr(
                          e,
                          'warning_' ~ i ~ '_name'
                        ),
                        true
                      )
                  %}

                {% endif %}

              {% endif %}

            {% endfor %}

            {{ ns.text }}


          aktuelle_warnung_ende: >

            {% set e =
              'sensor.stadt_bornheim_aktuelle_warnstufe'
            %}

            {% set count =
              state_attr(e, 'warning_count') | int(0)
            %}

            {% set ns =
              namespace(value=none)
            %}

            {% for i in range(1, count + 1) %}

              {% if ns.value is none %}

                {% set t =
                  (
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_name'
                      )
                      | default('', true)
                    )
                    ~ ' '
                    ~
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_headline'
                      )
                      | default('', true)
                    )
                  )
                  | lower
                %}

                {% if
                  'gewitter' in t
                  or 'sturm' in t
                  or 'orkan' in t
                  or 'wind' in t
                  or 'hagel' in t
                  or 'starkregen' in t
                  or 'dauerregen' in t
                %}

                  {% set ns.value =
                    state_attr(
                      e,
                      'warning_' ~ i ~ '_end'
                    )
                  %}

                {% endif %}

              {% endif %}

            {% endfor %}

            {{ ns.value }}


          vorwarnung_start: >

            {% set e =
              'sensor.stadt_bornheim_vorwarnstufe'
            %}

            {% set count =
              state_attr(e, 'warning_count') | int(0)
            %}

            {% set ns =
              namespace(value=none)
            %}

            {% for i in range(1, count + 1) %}

              {% if ns.value is none %}

                {% set t =
                  (
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_name'
                      )
                      | default('', true)
                    )
                    ~ ' '
                    ~
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_headline'
                      )
                      | default('', true)
                    )
                  )
                  | lower
                %}

                {% if
                  'gewitter' in t
                  or 'sturm' in t
                  or 'orkan' in t
                  or 'wind' in t
                  or 'hagel' in t
                  or 'starkregen' in t
                  or 'dauerregen' in t
                %}

                  {% set ns.value =
                    state_attr(
                      e,
                      'warning_' ~ i ~ '_start'
                    )
                  %}

                {% endif %}

              {% endif %}

            {% endfor %}

            {{ ns.value }}


          vorwarnung_ende: >

            {% set e =
              'sensor.stadt_bornheim_vorwarnstufe'
            %}

            {% set count =
              state_attr(e, 'warning_count') | int(0)
            %}

            {% set ns =
              namespace(value=none)
            %}

            {% for i in range(1, count + 1) %}

              {% if ns.value is none %}

                {% set t =
                  (
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_name'
                      )
                      | default('', true)
                    )
                    ~ ' '
                    ~
                    (
                      state_attr(
                        e,
                        'warning_' ~ i ~ '_headline'
                      )
                      | default('', true)
                    )
                  )
                  | lower
                %}

                {% if
                  'gewitter' in t
                  or 'sturm' in t
                  or 'orkan' in t
                  or 'wind' in t
                  or 'hagel' in t
                  or 'starkregen' in t
                  or 'dauerregen' in t
                %}

                  {% set ns.value =
                    state_attr(
                      e,
                      'warning_' ~ i ~ '_end'
                    )
                  %}

                {% endif %}

              {% endif %}

            {% endfor %}

            {{ ns.value }}


  # -------------------------------------------------------------------------
  # Akute Wettergefahr + Regen in Kürze
  # -------------------------------------------------------------------------

  - binary_sensor:

      - name: "Lüftung Wetter gefährlich"
        unique_id: lueftung_wetter_gefaehrlich
        default_entity_id: binary_sensor.lueftung_wetter_gefaehrlich
        icon: mdi:weather-lightning

        state: >

          {% set fc =
            state_attr(
              'sensor.lueftungs_wetterprognose',
              'forecast_24h'
            )
            | default([], true)
          %}

          {% set unit =
            state_attr(
              'weather.bornheim',
              'wind_speed_unit'
            )
            | default('km/h', true)
          %}

          {% set ns =
            namespace(hit=false)
          %}


          {% for f in fc[:2] %}

            {% set cond =
              f.get('condition', '')
            %}

            {% set wind =
              f.get('wind_speed', 0) | float(0)
            %}

            {% set gust =
              f.get('wind_gust_speed', 0) | float(0)
            %}


            {% if unit in ['m/s', 'mps'] %}

              {% set wind = wind * 3.6 %}
              {% set gust = gust * 3.6 %}

            {% elif unit == 'mph' %}

              {% set wind = wind * 1.60934 %}
              {% set gust = gust * 1.60934 %}

            {% endif %}


            {% if
              cond in [
                'lightning',
                'lightning-rainy',
                'hail',
                'exceptional',
                'pouring'
              ]
              or wind >= 50
              or gust >= 65
            %}

              {% set ns.hit = true %}

            {% endif %}

          {% endfor %}


          {{
            ns.hit
            or
            states('weather.bornheim') in [
              'lightning',
              'lightning-rainy',
              'hail',
              'exceptional',
              'pouring'
            ]
            or
            is_state(
              'sensor.lueftung_dwd_status',
              'gefahr'
            )
          }}


      - name: "Lüftung Regen bald"
        unique_id: lueftung_regen_bald
        default_entity_id: binary_sensor.lueftung_regen_bald
        icon: mdi:weather-rainy

        state: >

          {% set fc =
            state_attr(
              'sensor.lueftungs_wetterprognose',
              'forecast_24h'
            )
            | default([], true)
          %}

          {% set ns =
            namespace(hit=false)
          %}


          {% for f in fc[:2] %}

            {% if
              f.get('condition', '') in [
                'rainy',
                'pouring',
                'lightning-rainy',
                'snowy-rainy'
              ]
              or
              f.get(
                'precipitation_probability',
                0
              ) | float(0) >= 70
              or
              f.get(
                'precipitation',
                0
              ) | float(0) >= 0.5
            %}

              {% set ns.hit = true %}

            {% endif %}

          {% endfor %}


          {{
            ns.hit
            or
            states('weather.bornheim') in [
              'rainy',
              'pouring',
              'lightning-rainy',
              'snowy-rainy'
            ]
          }}


  # -------------------------------------------------------------------------
  # LÜFTUNGSBERATER V4
  # CO2 + Solltemperatur + NINA + Radar + DWD + 24h-Prognose
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # NINA: Außenluftwarnungen intelligent bewerten
  #
  # Entwarnungen werden für die Gefahrenentscheidung ignoriert.
  # Andere gleichzeitig aktive Warnslots werden weiterhin bewertet.
  # -------------------------------------------------------------------------

  - sensor:

      - name: "NINA Lüftungsstatus"
        unique_id: nina_lueftungsstatus
        default_entity_id: sensor.nina_lueftungsstatus
        icon: mdi:shield-airplane-outline

        state: >
          {% set ns =
            namespace(
              danger=false,
              caution=false
            )
          %}

          {% set air_words = [
            'brandrauch',
            'rauchentwicklung',
            'rauchgas',
            'rauchwolke',
            'rauchbelastung',
            'ausbreitung von rauch',
            'ausbreitung von brandrauch',
            'gefahrstoff',
            'schadstoff',
            'luftverunreinigung',
            'gasaustritt',
            'gaswolke',
            'chemieunfall',
            'chemikal',
            'giftige dämpfe',
            'giftige daempfe',
            'toxisch',
            'reizgas'
          ] %}

          {% set no_danger_words = [
            'keine gesundheitsgefahr',
            'keine gesundheitliche gefahr',
            'keine gefahr für die gesundheit',
            'keine gefahr fuer die gesundheit',
            'es besteht keine gefahr',
            'keine gefährdung',
            'keine gefaehrdung'
          ] %}

          {% for i in range(1, 6) %}

            {% set e =
              'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
            %}

            {% if is_state(e, 'on') %}

              {% set headline =
                state_attr(e, 'headline')
                | default('', true)
                | lower
              %}

              {% set description =
                state_attr(e, 'description')
                | default('', true)
                | lower
              %}

              {% set actions =
                state_attr(e, 'recommended_actions')
                | default(
                    state_attr(e, 'instruction'),
                    true
                  )
                | default('', true)
                | lower
              %}

              {% set severity =
                state_attr(e, 'severity')
                | default('Unknown', true)
              %}

              {% set alltext =
                headline ~ ' ' ~
                description ~ ' ' ~
                actions
              %}

              {% set is_clear =
                'entwarnung' in headline
                or 'entwarnung' in description
                or 'warnung ist aufgehoben' in description
                or 'warnung wurde aufgehoben' in description
                or 'die warnung ist aufgehoben' in description
              %}

              {% if not is_clear %}

                {% set flags =
                  namespace(
                    air=false,
                    no_danger=false,
                    precaution=false,
                    hard_close=false
                  )
                %}

                {% for word in air_words %}
                  {% if word in alltext %}
                    {% set flags.air = true %}
                  {% endif %}
                {% endfor %}

                {% for word in no_danger_words %}
                  {% if word in alltext %}
                    {% set flags.no_danger = true %}
                  {% endif %}
                {% endfor %}

                {% if
                  'vorsorglich fenster' in actions
                  or 'vorsorglich die fenster' in actions
                  or 'vorsorglich türen' in actions
                  or 'vorsorglich tueren' in actions
                %}
                  {% set flags.precaution = true %}
                {% endif %}

                {% if
                  'fenster und türen geschlossen halten' in actions
                  or 'fenster und tueren geschlossen halten' in actions
                  or 'halten sie fenster und türen geschlossen' in actions
                  or 'halten sie fenster und tueren geschlossen' in actions
                  or 'fenster geschlossen halten' in actions
                %}
                  {% set flags.hard_close = true %}
                {% endif %}

                {% if flags.no_danger %}

                  {% if flags.precaution or flags.air %}
                    {% set ns.caution = true %}
                  {% endif %}

                {% elif
                  (
                    flags.air
                    and severity in [
                      'Moderate',
                      'Severe',
                      'Extreme'
                    ]
                  )
                  or
                  (
                    flags.air
                    and flags.hard_close
                    and not flags.precaution
                  )
                  or
                  (
                    flags.air
                    and
                    (
                      'gesundheitsgefahr' in alltext
                      or 'gesundheitliche gefahr' in alltext
                      or 'giftig' in alltext
                      or 'toxisch' in alltext
                    )
                  )
                %}

                  {% set ns.danger = true %}

                {% elif flags.air or flags.precaution %}

                  {% set ns.caution = true %}

                {% endif %}

              {% endif %}
            {% endif %}
          {% endfor %}

          {% if ns.danger %}
            gefahr
          {% elif ns.caution %}
            vorsicht
          {% else %}
            keine
          {% endif %}

        attributes:

          warnung: >
            {% set ns =
              namespace(
                danger='',
                caution=''
              )
            %}

            {% for i in range(1, 6) %}

              {% set e =
                'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
              %}

              {% if is_state(e, 'on') %}

                {% set headline =
                  state_attr(e, 'headline')
                  | default('', true)
                %}

                {% set description =
                  state_attr(e, 'description')
                  | default('', true)
                %}

                {% set lowertext =
                  (headline ~ ' ' ~ description)
                  | lower
                %}

                {% set is_clear =
                  'entwarnung' in lowertext
                  or 'warnung ist aufgehoben' in lowertext
                  or 'warnung wurde aufgehoben' in lowertext
                %}

                {% if not is_clear %}

                  {% if
                    state_attr(e, 'severity')
                    in ['Moderate','Severe','Extreme']
                    and ns.danger == ''
                  %}
                    {% set ns.danger = headline %}
                  {% elif ns.caution == '' %}
                    {% set ns.caution = headline %}
                  {% endif %}

                {% endif %}
              {% endif %}
            {% endfor %}

            {{
              ns.danger
              if ns.danger != ''
              else ns.caution
            }}

          entwarnung: >
            {% set ns = namespace(v='') %}

            {% for i in range(1, 6) %}

              {% set e =
                'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
              %}

              {% if is_state(e, 'on') %}

                {% set headline =
                  state_attr(e, 'headline')
                  | default('', true)
                %}

                {% set description =
                  state_attr(e, 'description')
                  | default('', true)
                %}

                {% set lowertext =
                  (headline ~ ' ' ~ description)
                  | lower
                %}

                {% if
                  ns.v == ''
                  and
                  (
                    'entwarnung' in lowertext
                    or 'warnung ist aufgehoben' in lowertext
                    or 'warnung wurde aufgehoben' in lowertext
                  )
                %}
                  {% set clean =
                    headline
                    | replace('Entwarnung:', '')
                    | replace('Entwarnung -', '')
                    | trim
                  %}
                  {% set ns.v = clean %}
                {% endif %}
              {% endif %}
            {% endfor %}

            {{ ns.v }}

          beschreibung: >
            {% set wanted =
              state_attr(
                'sensor.nina_lueftungsstatus',
                'warnung'
              )
            %}

            {% set ns = namespace(v='') %}

            {% for i in range(1, 6) %}
              {% set e =
                'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
              %}

              {% if
                is_state(e, 'on')
                and
                state_attr(e, 'headline') == wanted
                and ns.v == ''
              %}
                {% set ns.v =
                  state_attr(e, 'description')
                  | default('', true)
                %}
              {% endif %}
            {% endfor %}

            {{ ns.v }}

          handlungsempfehlung: >
            {% set wanted =
              state_attr(
                'sensor.nina_lueftungsstatus',
                'warnung'
              )
            %}

            {% set ns = namespace(v='') %}

            {% for i in range(1, 6) %}
              {% set e =
                'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
              %}

              {% if
                is_state(e, 'on')
                and
                state_attr(e, 'headline') == wanted
                and ns.v == ''
              %}
                {% set ns.v =
                  state_attr(e, 'recommended_actions')
                  | default(
                      state_attr(e, 'instruction'),
                      true
                    )
                  | default('', true)
                %}
              {% endif %}
            {% endfor %}

            {{ ns.v }}

          schweregrad: >
            {% set wanted =
              state_attr(
                'sensor.nina_lueftungsstatus',
                'warnung'
              )
            %}

            {% set ns = namespace(v='') %}

            {% for i in range(1, 6) %}
              {% set e =
                'binary_sensor.bornheim_stadt_rhein_sieg_kreis_nordrhein_westfalen_warnung_' ~ i
              %}

              {% if
                is_state(e, 'on')
                and
                state_attr(e, 'headline') == wanted
                and ns.v == ''
              %}
                {% set ns.v =
                  state_attr(e, 'severity')
                  | default('Unknown', true)
                %}
              {% endif %}
            {% endfor %}

            {{ ns.v }}


