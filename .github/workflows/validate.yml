name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check frontend JavaScript syntax
        run: |
          find custom_components/lueftungsberater -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest-homeassistant-custom-component==0.13.360" "ruff==0.12.11"

      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('pytest-homeassistant-custom-component', version('pytest-homeassistant-custom-component')); print('pytest', version('pytest'))"
          python -c "import json; print('integration', json.load(open('custom_components/lueftungsberater/manifest.json', encoding='utf-8'))['version'])"

      - name: Run unit tests
        run: |
          python -m ruff check custom_components tests --select F,E9
          python -m pytest -v tests
