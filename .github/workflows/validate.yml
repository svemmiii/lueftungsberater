name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Older uploads accidentally copied the integration manifest into the
      # repository root. Hassfest treats every manifest.json as an integration
      # manifest and therefore reports "Domain does not match dir name" there.
      # Keep this guard until the accidental root copy has been deleted from git.
      - name: Ignore accidental root integration manifest
        shell: bash
        run: |
          if [ -f manifest.json ]; then
            echo "::warning title=Repository layout::Removing accidental root manifest.json from the CI checkout. Delete the root copy from the repository permanently."
            rm -f manifest.json
          fi

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          # This release tracks Home Assistant 2026.6.1, matching the
          # integration's declared minimum Home Assistant 2026.6.x generation.
          python -m pip install "pytest-homeassistant-custom-component==0.13.337"

      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('pytest-homeassistant-custom-component', version('pytest-homeassistant-custom-component')); print('pytest', version('pytest'))"
          python -c "import json; print('integration', json.load(open('custom_components/lueftungsberater/manifest.json', encoding='utf-8'))['version'])"

      - name: Run unit tests
        run: |
          python -m pytest -v tests
