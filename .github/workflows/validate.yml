name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean accidental root integration copies
        shell: bash
        run: |
          # The actual Home Assistant integration belongs only in:
          # custom_components/lueftungsberater/
          #
          # Older web uploads accidentally copied integration files into the
          # repository root. Hassfest interprets a root manifest.json as another
          # integration and fails with "Domain does not match dir name".
          rm -f             manifest.json             __init__.py             api.py             airing.py             air_quality.py             binary_sensor.py             co2.py             config_flow.py             const.py             coordinator.py             engine.py             entity.py             localization.py             models.py             mold.py             night.py             notifications.py             outside.py             providers.py             remote.py             remote_devices.py             runtime.py             sensor.py

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Clean accidental root integration copies
        shell: bash
        run: |
          # A root __init__.py makes pytest treat the complete repository as
          # the Python package "lueftungsberater". That package is incomplete
          # and caused all 118 tests to fail during setup.
          rm -f             manifest.json             __init__.py             api.py             airing.py             air_quality.py             binary_sensor.py             co2.py             config_flow.py             const.py             coordinator.py             engine.py             entity.py             localization.py             models.py             mold.py             night.py             notifications.py             outside.py             providers.py             remote.py             remote_devices.py             runtime.py             sensor.py

          # Old uploads also left duplicated test modules in the repository
          # root. They are not needed; the canonical tests live in tests/.
          rm -f test_*.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest-homeassistant-custom-component==0.13.337"

      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('pytest-homeassistant-custom-component', version('pytest-homeassistant-custom-component')); print('pytest', version('pytest'))"
          python -c "import json; print('integration', json.load(open('custom_components/lueftungsberater/manifest.json', encoding='utf-8'))['version'])"

      - name: Run unit tests
        run: |
          python -m pytest -v tests
