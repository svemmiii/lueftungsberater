name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "pytest-homeassistant-custom-component"

      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('pytest-homeassistant-custom-component', version('pytest-homeassistant-custom-component')); print('pytest', version('pytest'))"
          python -c "import json; print('integration', json.load(open('custom_components/lueftungsberater/manifest.json', encoding='utf-8'))['version'])"

      - name: Run unit tests
        run: |
          python -m pytest -v tests
