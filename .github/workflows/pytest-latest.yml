name: Latest HA compatibility

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-latest:
    name: Pytest latest HA stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install latest Home Assistant test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "pytest-homeassistant-custom-component"
      - name: Show test versions
        run: |
          python --version
          python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant')); print('pytest-homeassistant-custom-component', version('pytest-homeassistant-custom-component')); print('pytest', version('pytest'))"
      - name: Run unit tests against latest
        run: |
          python -m pytest -q tests
